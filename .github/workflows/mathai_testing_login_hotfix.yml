name: MathAI one-time testing login hotfix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply testing login patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("app.py")
          text = path.read_text(encoding="utf-8")

          # 1) Keep v0.8.8, add an explicit testing-period direct OTP switch.
          version_line = 'APP_VERSION = "v0.8.8"\n'
          testing_block = (
              'APP_VERSION = "v0.8.8"\n'
              '# 測試期間：登入驗證碼直接顯示於畫面，不寄送 Email。正式上線時改為 False。\n'
              'TESTING_DIRECT_OTP = True\n'
          )
          if 'TESTING_DIRECT_OTP = True' not in text:
              if version_line not in text:
                  raise SystemExit('APP_VERSION anchor not found')
              text = text.replace(version_line, testing_block, 1)

          # 2) Logout/account switching must clear testing-only login state too.
          old_clear = '''def clear_private_beta_auth_session():
              client = st.session_state.get("private_beta_auth_client")
              clear_authenticated_session(st.session_state, client)
          '''
          new_clear = '''def clear_private_beta_auth_session():
              client = st.session_state.get("private_beta_auth_client")
              clear_authenticated_session(st.session_state, client)
              for testing_key in (
                  "testing_direct_login",
                  "testing_direct_otp",
                  "testing_direct_otp_email",
              ):
                  st.session_state.pop(testing_key, None)
          '''
          if old_clear in text:
              text = text.replace(old_clear, new_clear, 1)
          elif '"testing_direct_login"' not in text[text.find('def clear_private_beta_auth_session'):text.find('def apply_private_beta_identity')]:
              raise SystemExit('clear_private_beta_auth_session anchor not found')

          # 3) Replace only the public login renderer. Existing G5-G9 self-built exam code is untouched.
          new_renderer = r'''def render_private_beta_auth_login():
              """Testing-period Email login with device history and on-screen OTP."""
              st.markdown("#### Email 驗證")
              if TESTING_DIRECT_OTP:
                  st.caption("測試期間：先不用寄 Email，驗證碼會直接顯示在畫面上。")
              else:
                  st.caption("輸入 Email，我們會寄送一次性驗證碼給你。")
              render_auth_diagnostics()

              with st.container():
                  recent_emails = get_recent_emails()
                  manual_email_option = "➕ 手動輸入新 Email..."
                  email_options = [*recent_emails, manual_email_option]

                  selected_email_option = st.selectbox(
                      "這台裝置曾使用的 Email",
                      email_options,
                      index=0 if recent_emails else len(email_options) - 1,
                      key="private_beta_recent_email_choice",
                  )

                  if recent_emails:
                      st.caption("會記住這台瀏覽器曾使用的 Email；最後一項可輸入新的 Email。")
                      if st.button(
                          "清除這台裝置的 Email 紀錄",
                          key="clear_private_beta_device_emails",
                      ):
                          clear_recent_emails()
                          for state_key in (
                              "private_beta_recent_email_choice",
                              "private_beta_email_input",
                              "testing_direct_otp",
                              "testing_direct_otp_email",
                              "private_beta_otp_sent",
                          ):
                              st.session_state.pop(state_key, None)
                          st.success("已清除這台裝置的 Email 紀錄。")
                          st.rerun()

                  if selected_email_option == manual_email_option:
                      email = st.text_input(
                          "Email",
                          value="",
                          key="private_beta_email_input",
                          autocomplete="email",
                          placeholder="example@gmail.com",
                      ).strip()
                  else:
                      email = str(selected_email_option).strip()
                      st.text_input(
                          "Email",
                          value=email,
                          disabled=True,
                          key="private_beta_selected_email_display",
                      )

                  normalized_current = normalize_email(email)
                  otp_email = normalize_email(
                      st.session_state.get("testing_direct_otp_email", "")
                  )
                  if TESTING_DIRECT_OTP and otp_email and otp_email != normalized_current:
                      st.session_state["private_beta_otp_sent"] = False

                  send_label = (
                      "顯示驗證碼（測試期間）"
                      if TESTING_DIRECT_OTP
                      else "寄送驗證碼"
                  )
                  if st.button(
                      send_label,
                      key="private_beta_send_otp",
                      use_container_width=True,
                  ):
                      if not re.fullmatch(r"[^\s@]+@[^\s@]+\.[^\s@]+", normalized_current):
                          st.error("Email 格式錯誤")
                      elif TESTING_DIRECT_OTP:
                          new_otp = str(random.randint(100000, 999999))
                          st.session_state["testing_direct_otp"] = new_otp
                          st.session_state["testing_direct_otp_email"] = normalized_current
                          st.session_state["private_beta_auth_email"] = normalized_current
                          st.session_state["private_beta_otp_sent"] = True
                          # 測試期間先記住此裝置使用過的 Email，方便反覆測試。
                          save_recent_email(normalized_current)
                      else:
                          client = get_private_beta_auth_client()
                          try:
                              normalized = request_email_otp(client, normalized_current)
                              st.session_state["private_beta_auth_email"] = normalized
                              st.session_state["private_beta_otp_sent"] = True
                              st.success("驗證碼已寄出，請查看 Email。")
                          except AuthFlowError as exc:
                              st.error(public_auth_error_message(exc))

                  if TESTING_DIRECT_OTP and st.session_state.get("private_beta_otp_sent"):
                      shown_otp = str(st.session_state.get("testing_direct_otp", "")).strip()
                      if shown_otp:
                          st.info(f"🔧 **[測試模式] 您的登入驗證碼是： {shown_otp}**")

                  if st.session_state.get("private_beta_otp_sent"):
                      with st.form("private_beta_verify_otp_form"):
                          otp = st.text_input(
                              "驗證碼",
                              type="password",
                              autocomplete="one-time-code",
                          )
                          verify = st.form_submit_button(
                              "登入／繼續",
                              type="primary",
                              use_container_width=True,
                          )

                      if verify:
                          if TESTING_DIRECT_OTP:
                              expected_otp = str(
                                  st.session_state.get("testing_direct_otp", "")
                              ).strip()
                              verified_email = normalize_email(
                                  st.session_state.get(
                                      "testing_direct_otp_email",
                                      st.session_state.get("private_beta_auth_email", email),
                                  )
                              )
                              if not expected_otp or str(otp).strip() != expected_otp:
                                  st.error("❌ 驗證碼錯誤，請重新確認！")
                              else:
                                  clear_private_beta_auth_session()
                                  clear_profile_widget_state(verified_email)
                                  db_profile = build_complete_user_profile(verified_email)
                                  if db_profile:
                                      apply_user_profile_to_session(
                                          db_profile,
                                          verified_email,
                                      )
                                      st.session_state["profile_load_notice"] = "existing"
                                      st.session_state["is_new_account_registration"] = False
                                  else:
                                      reset_user_profile_for_new_account(
                                          verified_email,
                                          credits=200,
                                      )
                                      st.session_state["profile_load_notice"] = "new"
                                      st.session_state["is_new_account_registration"] = True

                                  st.session_state["testing_direct_login"] = True
                                  st.session_state["developer_mode"] = False
                                  st.session_state["is_trial"] = False
                                  st.session_state["wallet_synced_email"] = ""
                                  st.session_state["is_verified"] = True
                                  st.session_state["private_beta_otp_sent"] = False
                                  save_recent_email(verified_email)
                                  st.rerun()
                          else:
                              client = get_private_beta_auth_client()
                              try:
                                  response = verify_email_otp(
                                      client,
                                      st.session_state.get("private_beta_auth_email", email),
                                      otp,
                                  )
                                  identity = resolve_authenticated_student(client)
                                  apply_private_beta_identity(
                                      st.session_state.get("private_beta_auth_email", email),
                                      identity.student_id,
                                      identity.auth_user_id,
                                  )
                                  sync_wallet_balance_to_session(
                                      st.session_state["user_profile"].get("email", ""),
                                      force=True,
                                      is_new_account=st.session_state.get(
                                          "is_new_account_registration", False
                                      ),
                                  )
                                  st.rerun()
                              except AuthFlowError as exc:
                                  st.error(public_auth_error_message(exc))
                              except LearningIdentityError:
                                  st.error("登入暫時失敗，請稍後再試")
          '''
          # Dedent the raw block exactly four spaces introduced by this workflow script.
          import textwrap
          new_renderer = textwrap.dedent(new_renderer)
          pattern = re.compile(
              r'def render_private_beta_auth_login\(\):\n.*?(?=\n# ==========================================\n# v0\.7\.0 資料架構規則)',
              re.S,
          )
          text, count = pattern.subn(new_renderer.rstrip() + '\n', text, count=1)
          if count != 1:
              raise SystemExit(f'login renderer replacement count={count}')

          # 4) During direct-test login, keep the 200 test points in Streamlit session.
          sync_old = '''        or email == "trial@example.com"
              or is_local_developer_session(email)
          ):
              return st.session_state["user_profile"].get("credits")'''
          sync_new = '''        or email == "trial@example.com"
              or is_local_developer_session(email)
              or st.session_state.get("testing_direct_login", False)
          ):
              return st.session_state["user_profile"].get("credits")'''
          if sync_old in text:
              text = text.replace(sync_old, sync_new, 1)
          elif 'testing_direct_login' not in text[text.find('def sync_wallet_balance_to_session'):text.find('def add_user_credits')]:
              raise SystemExit('sync wallet test bypass anchor not found')

          # 5) Test-mode refunds/rewards stay in the current session only.
          add_anchor = '''def add_user_credits(
              email,
              points,
              reason="manual_adjustment",
              reference_type="",
              reference_id="",
          ):
          '''
          add_replacement = '''def add_user_credits(
              email,
              points,
              reason="manual_adjustment",
              reference_type="",
              reference_id="",
          ):
              if st.session_state.get("testing_direct_login", False):
                  normalized_email = normalize_email(email)
                  current_email = normalize_email(
                      st.session_state["user_profile"].get("email", "")
                  )
                  if normalized_email and normalized_email == current_email:
                      st.session_state["user_profile"]["credits"] = max(
                          0,
                          int(st.session_state["user_profile"].get("credits", 0) or 0)
                          + int(points or 0),
                      )
                      return True
          '''
          if add_anchor in text:
              text = text.replace(add_anchor, add_replacement, 1)
          elif 'testing_direct_login' not in text[text.find('def add_user_credits'):text.find('def _table_first')]:
              raise SystemExit('add_user_credits anchor not found')

          # 6) Self-built exam and other AI usage deduct test points from session directly.
          deduct_pattern = re.compile(
              r'(def deduct_credit\(q_count=5\):.*?\n\s*)if email == "trial@example\.com" or is_local_developer_session\(email\):',
              re.S,
          )
          deduct_repl = (
              r'\1if (\n'
              r'        email == "trial@example.com"\n'
              r'        or is_local_developer_session(email)\n'
              r'        or st.session_state.get("testing_direct_login", False)\n'
              r'    ):'
          )
          text, count = deduct_pattern.subn(deduct_repl, text, count=1)
          if count != 1 and 'testing_direct_login' not in text[text.find('def deduct_credit'):text.find('def handle_api_error')]:
              raise SystemExit(f'deduct_credit replacement count={count}')

          path.write_text(text, encoding="utf-8")
          PY

          python -m py_compile app.py

      - name: Commit hotfix and remove one-time workflow
        shell: bash
        run: |
          rm -f .github/workflows/mathai_testing_login_hotfix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py .github/workflows/mathai_testing_login_hotfix.yml
          git commit -m "fix: restore testing OTP display and device email history"
          git push origin HEAD:main
