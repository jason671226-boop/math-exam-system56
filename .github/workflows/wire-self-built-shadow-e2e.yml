name: Wire self-built Shadow E2E

on:
  push:
    branches:
      - test/curriculum-supabase-shadow-v0.9
    paths:
      - .github/workflows/wire-self-built-shadow-e2e.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/curriculum-supabase-shadow-v0.9
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Patch Shadow E2E hook
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app.py')
          s = p.read_text(encoding='utf-8')

          import_anchor = '# 嘗試載入 Supabase 套件\n'
          import_block = '''# Shadow 測試站：自組試卷 G6/G8 即時旁路比對。\ntry:\n    from services.curriculum_master_feature import curriculum_master_v27_runtime\nexcept ModuleNotFoundError:\n    from app.services.curriculum_master_feature import curriculum_master_v27_runtime\n\n'''
          if 'from services.curriculum_master_feature import curriculum_master_v27_runtime' not in s:
              if import_anchor not in s:
                  raise SystemExit('import anchor not found')
              s = s.replace(import_anchor, import_block + import_anchor, 1)

          hook_anchor = '            version_options = curriculum_versions(exam_grade)\n'
          hook = '''            # Shadow E2E is observation-only: user-visible curriculum remains local.\n            if exam_grade in (6, 8):\n                try:\n                    _shadow_runtime = curriculum_master_v27_runtime(\n                        supabase_client=supabase_client\n                    )\n                    _shadow_route = _shadow_runtime.resolve_route(\n                        exam_grade, education_system="PREHIGH"\n                    )\n                    _shadow_observation = getattr(\n                        _shadow_runtime, "shadow_observation", lambda _profile_id: None\n                    )(_shadow_route.profile_id)\n                    if _shadow_observation is None:\n                        st.caption(\n                            f"🧪 Shadow G{exam_grade}: 尚未取得旁路觀察結果；畫面仍使用本地課程。"\n                        )\n                    elif _shadow_observation.matched:\n                        st.success(\n                            f"🧪 Shadow G{exam_grade}: ZIP ↔ Supabase parity PASS"\n                        )\n                    else:\n                        st.warning(\n                            f"🧪 Shadow G{exam_grade}: parity 未通過；畫面仍使用本地課程資料。"\n                        )\n                except Exception:\n                    st.warning(\n                        f"🧪 Shadow G{exam_grade}: 無法比對；畫面仍使用本地課程資料。"\n                    )\n\n'''
          if 'Shadow E2E is observation-only' not in s:
              if hook_anchor not in s:
                  raise SystemExit('self-built hook anchor not found')
              s = s.replace(hook_anchor, hook + hook_anchor, 1)

          p.write_text(s, encoding='utf-8')
          PY
      - name: Compile
        run: python -m py_compile app.py services/curriculum_master_feature.py services/curriculum_shadow_runtime_v27.py
      - name: Commit branch-only hook
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git commit -m "test: show live G6 G8 shadow parity in self-built exam"
          git push origin HEAD:test/curriculum-supabase-shadow-v0.9
